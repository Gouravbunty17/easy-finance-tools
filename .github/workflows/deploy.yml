# Deployment to production is already handled by Vercel's GitHub integration.
# This workflow validates changes independently; no VERCEL_TOKEN secret is needed.
name: Validate Website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run financial regression tests
        run: npm test
      - name: Build and prerender website
        run: npm run build
      - name: Exercise calculators in Chrome at mobile and desktop sizes
        run: npm run qa:browser
      - name: Attach usability screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calculator-browser-qa
          path: reports/browser-qa/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Audit indexability, canonical URLs and structured data
        run: npm run audit:seo
      - name: Generate site quality report
        run: npm run audit:site-quality
